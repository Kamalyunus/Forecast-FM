# Replenishment forecasting: decisions at 35-day and 90-day lead times;
# daily ecommerce demand, ~4 years, ~700k series.
#
# Every TODO is a placeholder for your data (WP1). Check what the code will
# actually use with:   python -m forecast_fm config [--profile full] [--check-data]
#
# How this file is read (see forecast_fm/config.py):
#   extends: base.yaml      start from another file and override it
#   sections                data:, filters:, preprocessing:, covariates:, plans:,
#                           task:, backtest:, evaluation:, paths: only group
#                           keys; a key means the same inside or outside them
#   profiles:               named overlays: --profile NAME or $FORECAST_FM_PROFILE
#   --set key=value         command-line override; dotted keys reach into
#                           mappings: --set covariate_eval_policy.price=carry_forward
#   ${VAR} / ${VAR:-dflt}   environment variables inside any string
name: ecommerce-replenishment

data:
  # a file, a parquet directory, a glob ("data/raw/part-*.parquet") or a list
  data_path: data/raw/sales_sample.parquet   # the output of `sample`
  timestamp_col: date                        # TODO
  target_col: units                          # TODO: demand (units sold); may be a derived column
  series_id_cols: [sku]                      # TODO: grain, e.g. [sku] or [sku, warehouse]
  freq: D                                    # daily only

filters:                   # applied to raw rows, before the daily grid
  start_date: null         # e.g. 2022-01-01: drop older rows (pre-replatform, COVID...)
  end_date: null
  row_filter: null         # pandas query, e.g. "channel == 'web' and country == 'DE'"

preprocessing:
  # new columns from pandas expressions over the raw columns, evaluated in
  # order (a later one may use an earlier one). They are also applied to
  # plan snapshots whenever the inputs are there.
  derived_columns:
    # discount_pct: "1 - price / regular_price"
    # net_units: "units - returns"       # then target_col: net_units
  duplicates: error        # repeated (series, date) rows: error | sum | mean | max | first | last
  negative_target: keep    # keep | clip (to 0) | nan | error
  missing_target: zero     # demand on days with no raw row: zero | nan (unknown)
  grid_end: global         # series run to the panel's last date (global) or their own last row (series)

covariates:
  # KNOWN: you know every future day's value at forecast time (price you set,
  # the promo calendar). The model gets history AND horizon values.
  known_covariate_cols:          # TODO
    - price
    - discount_pct
    - promo_flag
    - promo_type                 # categorical
    - sitewide_event             # 0..N: Black Friday, paydays, holidays
  # PAST: observed only after the fact: history only, never in the horizon.
  # Observed weather belongs here. Weather FORECASTS as issued may be known,
  # fed via plan snapshots.
  past_covariate_cols:           # TODO
    - sessions
    - in_stock
  # STATIC: one value per series. Chronos-2 uses them for `group_by`
  # cross-learning; `slice_cols` below breaks metrics down by them.
  static_cols: [category, brand]           # TODO
  demand_label_col: demand_label           # TODO: intermittent / seasonal / BAU / event / promo
  covariate_types: {promo_type: categorical}   # pin numeric | categorical where inference is wrong
  # days with no raw row: ffill | zero | nan (default: known -> ffill, past -> nan)
  covariate_fill: {discount_pct: zero, promo_flag: zero, promo_type: nan, sitewide_event: zero}
  # Stockouts (the target is hidden from the model and not scored). Either
  # a column where 0 = stocked out, or an expression that is True on stockouts:
  in_stock_col: in_stock                   # TODO
  stockout_expr: null                      # e.g. "stock_on_hand <= 0 and units == 0"

plans:
  # What the model is GIVEN for the forecast window, in backtest and
  # production, per known covariate:
  #   plan           latest plan snapshot with as_of <= cutoff
  #   actual         realized value: only for fixed calendars
  #   carry_forward  value at the cutoff, held flat
  covariate_eval_policy:
    price: plan
    discount_pct: plan
    promo_flag: plan
    promo_type: plan
    sitewide_event: actual
  # Snapshot file(s): <as_of>, <timestamp>, <series_id_cols...>, <known cols>,
  # rows as_of+1 .. as_of+horizon. Only the `cutoffs` dates are needed for
  # backtests; production needs today's.
  planned_covariates_path: data/raw/plan_snapshots.parquet   # TODO (file, dir, glob or list)
  plan_as_of_col: as_of
  plan_timestamp_col: null       # default: timestamp_col
  plan_columns: {}               # rename plan columns, e.g. {planned_price: price}
  min_plan_coverage: 0.99        # warn when a covariate's coverage is lower
  plan_max_age_days: null        # warn when the latest snapshot is older, e.g. 7

task:
  horizon: 90
  horizon_buckets: [35, 90]      # reported as h01-35 and h36-90
  season_length: 7

backtest:                        # identical for every experiment
  n_folds: 4
  fold_step: 91
  min_train_periods: 730
  holdout_folds: 1
  cutoffs: null                  # or explicit dates: [2024-03-31, 2024-06-30, ...]
  holdout_cutoffs: null

evaluation:
  quantiles: [0.1, 0.5, 0.9]
  service_level: 0.95            # TODO: your decision quantile (added to quantiles)
  primary_metric: wape           # wape | mase | wql
  verdict_threshold: 0.01
  slice_cols: [category]         # statics to break metrics down by
  success_criteria: {}

# defaults per model family, under each experiment's model_params (the
# experiment wins): set machine settings once, not in every config
# --- new and short-history series (cold start) --------------------------------
# At each forecast origin, series with less history than min_history_days,
# and SKUs with none yet, get a launch-profile forecast: mean and quantiles
# of daily demand by days-since-launch across past launches in the same
# profile_cols group (finest group with >= min_analogs, then coarser, then
# all). Decided per origin from data <= origin, never from later data.
min_history_days: 28
cold_start:
  method: launch_profile         # launch_profile | zero | none
  profile_cols: [category]       # coarsest first, e.g. [category, subcategory]
  min_analogs: 20
  new_series_path: null          # production: upcoming SKUs (id cols, statics, launch_date)
  launch_date_col: launch_date
  from_plans: true               # SKUs in the plan snapshot without history are new too

# --- sharding (python -m forecast_fm forecast ... --shards N) --------------------
# statics that choose the shard; series sharing them stay together. Match
# cold_start.profile_cols so launch-profile pools equal an unsharded run.
shard_by: [category]

model_defaults:
  chronos2:
    device: auto                 # cuda > mps > cpu
    dtype: float32
    batch_size: 256
    # model_id: models/chronos-2  # a local copy for offline use

paths:
  reports_dir: reports
  models_dir: models

profiles:
  # python -m forecast_fm --profile full forecast ...
  full:
    data_path: data/raw/sales_full.parquet
  # a fast loop while debugging configs
  smoke:
    n_folds: 1
    row_filter: "category == 'shoes'"
  # an x86 / CUDA box
  cuda:
    # --- new and short-history series (cold start) --------------------------------
# At each forecast origin, series with less history than min_history_days,
# and SKUs with none yet, get a launch-profile forecast: mean and quantiles
# of daily demand by days-since-launch across past launches in the same
# profile_cols group (finest group with >= min_analogs, then coarser, then
# all). Decided per origin from data <= origin, never from later data.
min_history_days: 28
cold_start:
  method: launch_profile         # launch_profile | zero | none
  profile_cols: [category]       # coarsest first, e.g. [category, subcategory]
  min_analogs: 20
  new_series_path: null          # production: upcoming SKUs (id cols, statics, launch_date)
  launch_date_col: launch_date
  from_plans: true               # SKUs in the plan snapshot without history are new too

# --- sharding (python -m forecast_fm forecast ... --shards N) --------------------
# statics that choose the shard; series sharing them stay together. Match
# cold_start.profile_cols so launch-profile pools equal an unsharded run.
shard_by: [category]

model_defaults: {chronos2: {device: cuda, dtype: bfloat16, batch_size: 1024}}
